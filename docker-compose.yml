services:
  api:
    image: financial-agent:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FINAGENT_EMBEDDED_WORKER: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/runtime:/app/data/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  worker:
    image: financial-agent:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "agent.worker"]
    env_file:
      - .env
    volumes:
      - ./data/runtime:/app/data/runtime
    depends_on:
      api:
        condition: service_healthy

  ui:
    image: financial-agent:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    environment:
      API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
