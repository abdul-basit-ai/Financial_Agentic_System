services:
  neo4j:
    image: neo4j:5
    container_name: financial-agent-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  redis:
    image: redis:7-alpine
    container_name: financial-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: financial-agent-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: financial_agent
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: financial-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - neo4j
      - redis
      - pgvector
    volumes:
      - ./agent:/app/agent
      - ./api:/app/api
      - ./ingestion:/app/ingestion

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: financial-agent-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./ui:/app/ui

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  pgvector_data:
