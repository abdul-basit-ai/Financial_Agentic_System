apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-agent-config
data:
  FINAGENT_AUTH_MODE: supabase
  FINAGENT_EMBEDDED_WORKER: "0"
  FINAGENT_CHECKPOINT_BACKEND: postgres
  SUPABASE_REPORT_BUCKET: financial-reports
  WORKER_CONCURRENCY: "2"
  WORKER_LEASE_SECONDS: "600"
  DOCUMENT_OCR_DPI: "240"
  MAX_UPLOAD_BYTES: "20971520"
  MAX_DOCUMENT_PAGES: "1000"
  FINAGENT_ENABLE_REMOTE_TRACING: "0"
  API_URL: http://financial-agent-api:80
