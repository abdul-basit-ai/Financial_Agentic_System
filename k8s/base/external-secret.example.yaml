apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: financial-agent-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: financial-agent-secret-store
  target:
    name: financial-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_URL
      remoteRef:
        key: financial-agent
        property: SUPABASE_URL
    - secretKey: SUPABASE_PUBLISHABLE_KEY
      remoteRef:
        key: financial-agent
        property: SUPABASE_PUBLISHABLE_KEY
    - secretKey: SUPABASE_SECRET_KEY
      remoteRef:
        key: financial-agent
        property: SUPABASE_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: financial-agent
        property: DATABASE_URL
