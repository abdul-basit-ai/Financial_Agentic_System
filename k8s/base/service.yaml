apiVersion: v1
kind: Service
metadata:
  name: financial-agent-api
spec:
  selector:
    app: financial-agent-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: financial-agent-ui
spec:
  selector:
    app: financial-agent-ui
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
