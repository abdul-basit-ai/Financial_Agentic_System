apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finagent-dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - target:
      kind: Deployment
      name: financial-agent-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: financial-agent-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: financial-agent-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: financial-agent-worker
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Ingress
      name: financial-agent-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.financial-agent.example.com
      - op: replace
        path: /spec/rules/0/host
        value: dev.financial-agent.example.com
