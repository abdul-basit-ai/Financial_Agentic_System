apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finagent-staging

resources:
  - ../../base
  - namespace.yaml

patches:
  - target:
      kind: Ingress
      name: financial-agent-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.financial-agent.example.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.financial-agent.example.com
