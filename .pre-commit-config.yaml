repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --locked --extra dev black --workers 1
        language: system
        types: [python]
        args: [--target-version, py311, --line-length, "88"]
      - id: ruff
        name: ruff
        entry: uv run --locked --extra dev ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked --extra dev mypy agent api ingestion knowledge evaluation observability ui
        language: system
        pass_filenames: false
        files: ^(agent|api|ingestion|knowledge|evaluation|observability|ui)/
