repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      # NOTE: no ruff-format hook — black is this repo's canonical formatter
      # (isort profile=black). Running both formatters here makes them fight:
      # each rewrites the same files to its own style, so every commit aborts
      # and the next one rewrites back, forever.

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Mirror CI (ci.yml runs `mypy agent/`): type-gate the agent package,
        # not the whole tree. Ingestion/evaluation scripts carry older
        # untyped patterns CI has never gated.
        files: ^agent/
        additional_dependencies: []
