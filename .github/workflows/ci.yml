name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - name: Install locked project and development dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check agent api ingestion knowledge evaluation observability ui infra tests

      - name: Check formatting
        run: uv run black --check --target-version py311 --line-length 88 agent api ingestion knowledge evaluation observability ui infra tests

      - name: Type check
        run: uv run mypy agent api ingestion knowledge evaluation observability ui

      - name: Run offline tests
        env:
          FINAGENT_INTEGRATION_TESTS: "0"
          FINAGENT_TESTS_LLM: "0"
        run: uv run pytest -q

      - name: Run candidate-runtime regression gate
        env:
          FINAGENT_INTEGRATION_TESTS: "0"
          FINAGENT_TESTS_LLM: "0"
        run: uv run python -m evaluation.run_regression

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Verify the supported infrastructure target
        run: uv run python infra/validate_target.py

      - name: Build distributions
        run: uv build

      - name: Verify packaged runtime assets
        run: uv run python -c "from pathlib import Path; import zipfile; wheel = next(Path('dist').glob('*.whl')); archive = zipfile.ZipFile(wheel); required = {'agent/prompts/planner_v1.txt', 'agent/tools/schemas/safe_math_schema.json', 'ui/styles.css'}; missing = required - set(archive.namelist()); assert not missing, f'Missing wheel assets: {sorted(missing)}'"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - uses: docker/setup-buildx-action@v3

      - name: Build application image
        run: docker build -f docker/Dockerfile.api -t financial-agent:ci .
