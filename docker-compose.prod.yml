services:
  api:
    image: ${FINAGENT_IMAGE:-financial-agent:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FINAGENT_AUTH_MODE: supabase
      FINAGENT_API_TOKEN: ""
      FINAGENT_EMBEDDED_WORKER: "0"
      FINAGENT_CHECKPOINT_BACKEND: postgres
      SUPABASE_REPORT_BUCKET: ${SUPABASE_REPORT_BUCKET:-financial-reports}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    image: ${FINAGENT_IMAGE:-financial-agent:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "agent.worker"]
    env_file:
      - .env
    environment:
      FINAGENT_AUTH_MODE: supabase
      FINAGENT_API_TOKEN: ""
      FINAGENT_EMBEDDED_WORKER: "0"
      FINAGENT_CHECKPOINT_BACKEND: postgres
      SUPABASE_REPORT_BUCKET: ${SUPABASE_REPORT_BUCKET:-financial-reports}
    depends_on:
      api:
        condition: service_healthy

  ui:
    image: ${FINAGENT_IMAGE:-financial-agent:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    environment:
      API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
